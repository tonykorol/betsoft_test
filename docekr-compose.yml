version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: postgres_bet
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: redis_bet
    restart: always
    ports:
      - "6379:6379"

  line-provider:
    build: line_provider
    container_name: line-provider
    restart: always
    ports:
      - "8001:8001"
    env_file:
      - .env
    depends_on:
      - redis

  bet-maker:
    build: bet_maker
    container_name: bet-maker
    restart: always
    ports:
      - "8002:8002"
    env_file:
      - .env
    depends_on:
      - postgres
      - line-provider

  celery:
    build: bet_maker
    container_name: celery_worker
    restart: always
    command: ["celery", "-A", "tasks", "worker", "--loglevel=info"]
    env_file:
      - .env
    depends_on:
      - redis
      - bet-maker

volumes:
  postgres_data:
